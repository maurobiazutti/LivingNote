<div data-controller="time"
  class="flex flex-col items-center gap-6 p-8 bg-slate-900 text-white rounded-2xl w-full max-w-md mx-auto mt-8 shadow-2xl border border-slate-800">

  <h2 class="text-3xl font-bold text-slate-300">🍎 Pomodoro</h2>

  <!-- Display do Tempo -->
  <div data-time-target="display" class="text-6xl font-mono font-extrabold tracking-wider text-emerald-400">
    30:00
  </div>

  <!-- Atalhos de Ajuste Rápido -->
  <div class="flex gap-2">
    <button data-action="click->time#setPreset" data-minutes="25"
      class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold border border-slate-700">
      25 min (Foco)
    </button>
    <button data-action="click->time#setPreset" data-minutes="30"
      class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold border border-slate-700">
      30 min (Foco)
    </button>
    <button data-action="click->time#setPreset" data-minutes="5"
      class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold border border-slate-700">
      5 min (Pausa)
    </button>
  </div>

  <!-- Definir Tempo Personalizado -->
  <div class="flex items-center gap-2">
    <input type="number" min="1" max="180" placeholder="Min" data-time-target="minutesInput"
      class="w-20 px-3 py-1 bg-slate-800 border border-slate-700 rounded text-center text-sm text-white focus:outline-none focus:border-emerald-500">
    <button data-action="click->time#setCustomTime"
      class="px-5 py-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-900 rounded-lg font-bold text-sm transition shadow-lg shadow-emerald-500/30 hover:shadow-emerald-400/50 hover:scale-105 active:scale-95">
      Definir Tempo
    </button>
  </div>

  <!-- Botões de Controle Principal -->
  <div class="flex gap-3 w-full justify-center pt-2">
    <button data-action="click->time#start"
      class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-sm transition shadow-lg shadow-emerald-900/40">
      Iniciar
    </button>

    <button data-action="click->time#pause"
      class="flex-1 py-2.5 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold text-sm transition shadow-lg shadow-amber-900/40">
      Pausar
    </button>

    <button data-action="click->time#reset"
      class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-400 rounded-lg font-bold text-sm transition">
      Reiniciar
    </button>
  </div>

</div>
